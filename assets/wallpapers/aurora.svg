<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050713"/>
      <stop offset=".55" stop-color="#071426"/>
      <stop offset="1" stop-color="#03060d"/>
    </linearGradient>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1600" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ffc6" stop-opacity="0"/>
      <stop offset=".35" stop-color="#2bf5c0" stop-opacity=".75"/>
      <stop offset=".7" stop-color="#3b82f6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="200" y1="0" x2="1400" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a855f7" stop-opacity=".45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur80" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blur24" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g filter="url(#blur80)" opacity=".85">
    <ellipse cx="280" cy="240" rx="260" ry="150" fill="#0ea5e9" opacity=".35"/>
    <ellipse cx="1280" cy="180" rx="320" ry="180" fill="#7c3aed" opacity=".3"/>
    <ellipse cx="900" cy="520" rx="420" ry="200" fill="#059669" opacity=".18"/>
  </g>
  <g fill="#fff">
    <circle cx="120" cy="120" r="1.6" opacity=".8"/><circle cx="310" cy="70" r="1.1" opacity=".55"/>
    <circle cx="470" cy="180" r="1.8" opacity=".7"/><circle cx="640" cy="90" r="1.2" opacity=".5"/>
    <circle cx="820" cy="150" r="1.5" opacity=".8"/><circle cx="990" cy="60" r="1" opacity=".5"/>
    <circle cx="1150" cy="130" r="1.9" opacity=".75"/><circle cx="1310" cy="80" r="1.2" opacity=".6"/>
    <circle cx="1440" cy="210" r="1.6" opacity=".7"/><circle cx="1510" cy="60" r="1" opacity=".45"/>
    <circle cx="210" cy="320" r="1.2" opacity=".5"/><circle cx="700" cy="260" r="1.1" opacity=".45"/>
    <circle cx="1060" cy="300" r="1.4" opacity=".55"/><circle cx="1370" cy="360" r="1" opacity=".4"/>
  </g>
  <g filter="url(#blur24)" opacity=".9">
    <path d="M-100 520 C 250 240, 470 620, 780 380 S 1250 160, 1720 430" stroke="url(#ribbon1)" stroke-width="130" fill="none"/>
    <path d="M-150 660 C 260 470, 520 760, 860 520 S 1330 340, 1750 600" stroke="url(#ribbon2)" stroke-width="90" fill="none" opacity=".8"/>
  </g>
  <g filter="url(#soft)" opacity=".55">
