  <ellipse cx="800" cy="900" rx="900" ry="260" fill="url(#glow)" opacity=".35"/>
  <g fill="#02050b" opacity=".9">
    <path d="M0 760 L180 640 L330 720 L520 590 L700 730 L890 620 L1090 740 L1290 610 L1460 720 L1600 650 L1600 900 L0 900 Z" opacity=".55"/>
    <path d="M0 830 L220 740 L420 820 L640 720 L860 830 L1080 740 L1320 830 L1520 750 L1600 800 L1600 900 L0 900 Z"/>
