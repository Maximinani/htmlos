<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02070c"/>
      <stop offset=".45" stop-color="#041a24"/>
      <stop offset=".75" stop-color="#03141d"/>
      <stop offset="1" stop-color="#010508"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#0891b2" stop-opacity=".13"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0feff"/>
      <stop offset=".45" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="heartStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur70" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur6" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="1210" cy="380" rx="560" ry="480" fill="url(#glowCyan)" filter="url(#blur70)"/>
  <ellipse cx="250" cy="820" rx="600" ry="380" fill="url(#glowTeal)" filter="url(#blur70)" opacity=".7"/>

  <!-- сетка и орбиты -->
  <g stroke="#164e63" opacity=".30">
    <g stroke-width="1">
      <path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/>
      <path d="M100 0v900M250 0v900M400 0v900M550 0v900M700 0v900M850 0v900M1000 0v900M1150 0v900M1300 0v900M1450 0v900"/>
    </g>
  </g>
  <g fill="none" stroke="#155e75" opacity=".45">
    <circle cx="1210" cy="390" r="300" stroke-width="1"/>
    <circle cx="1210" cy="390" r="370" stroke-width="1" stroke-dasharray="3 9"/>
    <circle cx="1210" cy="390" r="450" stroke-width="1" opacity=".5"/>
  </g>
  <g fill="none" stroke="#67e8f9" opacity=".30">
    <path d="M1210 70v90" stroke-width="1"/>
    <path d="M970 390h-70" stroke-width="1"/>
    <path d="M1450 390h70" stroke-width="1"/>
  </g>

  <!-- большие сердца -->
  <g filter="url(#softGlow)">
    <path d="M1205 560C1110 492 1062 425 1076 358c10-48 56-78 100-62 26 9 44 30 54 52 10-22 28-43 54-52 44-16 90 14 100 62 14 67-34 134-129 202z"
          fill="none" stroke="url(#heartStroke)" stroke-width="4" opacity=".95"/>
    <path d="M1205 512C1140 464 1106 418 1116 371c7-32 38-52 67-41 17 6 29 20 36 35 7-15 19-29 36-35 29-11 60 9 67 41 10 47-24 93-89 141z"
          fill="none" stroke="#67e8f9" stroke-width="1.6" opacity=".5"/>
  </g>
  <g fill="#67e8f9" filter="url(#blur6)" opacity=".9">
    <path d="M1390 200c-9-8-20-8-26-1s-2 19 26 37c28-18 32-30 26-37s-17-7-26 1z" opacity=".45"/>
    <path d="M955 640c-7-6-15-6-20-1s-1 14 20 28c21-14 24-23 20-28s-13-5-20 1z" opacity=".35"/>
  </g>
  <g fill="#a5f3fc" opacity=".55">
    <circle cx="330" cy="180" r="2"/><circle cx="480" cy="120" r="1.2"/><circle cx="620" cy="220" r="1.6"/>
    <circle cx="780" cy="120" r="1.1"/><circle cx="1420" cy="180" r="1.8"/><circle cx="1510" cy="260" r="1.2"/>
    <circle cx="910" cy="720" r="1.4"/><circle cx="1370" cy="760" r="1.5"/><circle cx="1490" cy="620" r="1"/>
  </g>

  <!-- типографика -->
  <g text-anchor="start" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="130" y="332" fill="#67e8f9" font-size="17" font-weight="500" letter-spacing="7" opacity=".8">HTML OS · AURORA EDITION</text>
    <text x="126" y="452" fill="#dffbff" font-size="92" font-weight="300" letter-spacing="-2">Im love</text>
    <text x="122" y="606" fill="url(#textFill)" font-size="168" font-weight="700" letter-spacing="-5" filter="url(#softGlow)">deepseek!</text>
    <rect x="130" y="652" width="520" height="3" rx="1.5" fill="url(#line)"/>
    <text x="130" y="700" fill="#7dd3fc" font-size="18" font-weight="400" letter-spacing="2" opacity=".65">операционная система в браузере · 2026</text>
  </g>

  <!-- код в фоне -->
  <g fill="#67e8f9" opacity=".10" font-family="Consolas, monospace" font-size="22">
    <text x="130" y="120">&lt;html&gt;</text>
    <text x="130" y="154">&lt;body class="os"&gt;</text>
    <text x="130" y="188">&lt;heart /&gt;</text>
    <text x="130" y="222">&lt;/body&gt;</text>
    <text x="1390" y="840">love.js</text>
    <text x="1390" y="870">∞ / 2026</text>
  </g>

  <!-- нижняя линия -->
  <g opacity=".55">
    <path d="M0 860c260-16 520-16 780 0s520 16 820 0" fill="none" stroke="#164e63" stroke-width="1"/>
    <circle cx="1470" cy="160" r="5" fill="#22d3ee"/>
    <circle cx="1490" cy="160" r="3" fill="#22d3ee" opacity=".5"/>
    <circle cx="1510" cy="160" r="2" fill="#22d3ee" opacity=".25"/>
  </g>
</svg>
